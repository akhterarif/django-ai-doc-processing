version: '3.12'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: doc_processor_db_2
      POSTGRES_USER: doc_processor_user
      POSTGRES_PASSWORD: doc_processor_password
    volumes:
      - postgres_data_new:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doc_processor_user -d doc_processor_db_2"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: /bin/sh
    command:
      - -c
      - "ollama serve & sleep 15 && ollama pull gemma2:9b && wait"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/code
      - chroma_data:/tmp/chroma_data
      - chroma_cache:/root/.cache/chroma
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - OLLAMA_URL=http://ollama:11434
      - CHROMA_DATA_DIR=/tmp/chroma_data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_healthy

  celery:
    build: .
    command: celery -A django_ai_doc_processing worker -l info
    volumes:
      - .:/code
      - chroma_data:/tmp/chroma_data
      - chroma_cache:/root/.cache/chroma
    env_file:
      - .env
    environment:
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - OLLAMA_URL=http://ollama:11434
      - CHROMA_DATA_DIR=/tmp/chroma_data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - web

volumes:
  postgres_data_new:
  ollama_data:
  chroma_data:
  chroma_cache:
